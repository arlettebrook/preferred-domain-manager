name = "preferred-domain-manager"
main = "src/main.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]
minify = true

# 发布前执行：wrangler kv namespace create PDM_KV
[[kv_namespaces]]
binding = "PDM_KV"
id = "replace-with-your-kv-namespace-id"

[[durable_objects.bindings]]
name = "SYNC_LOCK"
class_name = "SyncLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncLock"]

[triggers]
crons = ["*/10 * * * *"]

[vars]
# 必填项建议用 wrangler secret put 设置，不要把真实值提交到仓库。
# ADMIN_PASSWORD = "change-me"
# SESSION_SECRET = "a-long-random-secret"
# CF_API_TOKEN = "optional-global-zone-api-token"
# DEFAULT_DOMAIN = "example.com"
# CF_ZONE_ID = "optional-default-zone-id"
